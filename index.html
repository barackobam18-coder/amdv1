    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      html, body {
        height: 100dvh;
        width: 100%;
        background: #ffffff; /* พื้นหลังสีขาว */
        color: #1a1a1a;     /* สีตัวอักษรเข้มขึ้นเพื่อให้อ่านง่ายบนพื้นขาว */
        font-family: 'Noto Sans Thai', 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center; /* จัดกลางแนวตั้ง */
      }
      
      .content {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      
      .logo-mark {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        background: #f0f7ff;
        border: 1px solid #d1e3ff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      
      .brand-name {
        font-family: 'Inter', sans-serif;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #3399ff 0%, #0066cc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }
      
      .brand-sub {
        font-size: 16px;
        font-weight: 600;
        color: #555555;
        letter-spacing: 5px;
        margin-bottom: 35px;
      }
      
      @keyframes blue-pulse-light {
        0%, 100% { box-shadow: 0 4px 15px rgba(51, 153, 255, 0.25); transform: scale(1); }
        50% { box-shadow: 0 6px 20px rgba(51, 153, 255, 0.45); transform: scale(1.01); }
      }

      .btn-line {
        width: 100%;
        padding: 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #3399ff 0%, #0066cc 100%);
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        text-decoration: none;
        text-align: center;
        margin-bottom: 25px;
        animation: blue-pulse-light 1.5s infinite;
        border: none;
        display: block;
        cursor: pointer;
      }
      
      .line-id { font-size: 16px; margin-bottom: 20px; color: #333333; }
      .line-id strong { color: #0066cc; }
      
      .fbiab {
        font-size: 14px;
        color: #666666;
        text-align: center;
        line-height: 1.6;
        margin-bottom: 25px;
      }
      .blue-text { color: #0ea5e9; font-weight: 700; }
      
      .qr-container {
        width: 190px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }
      .qr-container img { 
        width: 100%; 
        height: 100%; 
        object-fit: contain;

        filter: hue-rotate(100deg) saturate(250%) brightness(1.1);
      }

    <script>
